name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Rating/tick commits from the phone only touch progress.csv; the page
    # reads that file through the GitHub API, so no redeploy is needed.
    paths-ignore:
      - data/progress.csv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js lib.js manifest.webmanifest icon.svg icon-*.png _site/
          cp data/readings.csv _site/data/
          cp -r fonts _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
